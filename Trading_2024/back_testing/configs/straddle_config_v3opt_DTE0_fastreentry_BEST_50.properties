# =============================================================================
# straddle_config_v3opt_DTE0_fastreentry_BEST_50.properties
# For atm_straddle_expiry_day_V3OPT.py (backtest).
#
# Strategy parameters taken from live_trader_config_50.properties, which was
# synchronised from optimizer profile:
#   short_straddle_v3opt_fastreentry_1540_v2_20261002_165055_BEST_50.properties
#
# Absolute rupee caps are HALVED vs the live config: the live config doubles
# them for 2x live quantity, while this backtest trades NIFTY=325 / SENSEX=100.
#   MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT : live 5000 -> 2500
#   MAX_DAILY_LOSS_RUPEES            : live 60000 -> 30000
#   NIFTY_MAX_DAILY_LOSS_RUPEES      : live 36000 -> 18000
#   SENSEX_MAX_DAILY_LOSS_RUPEES     : live 44000 -> 22000
# Percentages, times, re-entry counts and delays are copied unchanged.
# Data-location, backtest-window and OPT_* keys are kept from the base
# straddle_config_v3opt_DTE0_fastreentry.properties.
# =============================================================================

# ---- Data location ---------------------------------------------------------
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2
#PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2_2years
#PICKLES_DIR=G:\My Drive\Trading\Historical_Options_Data
# 1-sec sqlite folder (kite_option_spikes_v3_*.sqlite3) works too - just point PICKLES_DIR at it:
#PICKLES_DIR=G:\My Drive\Trading\Kite_tick-data
# AUTO detects pickle vs sqlite from the files; force with PICKLE / SQLITE if a folder has both
DATA_FORMAT=AUTO
# Optional filename filter, e.g. kite_option_spikes_v3_*.sqlite3 (blank = all files of that format)
#DATA_FILE_GLOB=
# sqlite only: 1 = native 1-sec bars; 60 = resample to 1-min for comparison with pickle runs
SQLITE_BAR_SECONDS=1

# ---- Entry (both underlyings) ------------------------------------------------
ENTRY_TIME_IST=09:18
EXIT_TIME_IST=15:22
ENTRY_MOMENTUM_GATE=0
MOMENTUM_LOOKBACK_MIN=8
ALLOWED_DTE=0

# ---- Stop-loss ------------------------------------------------------------------
