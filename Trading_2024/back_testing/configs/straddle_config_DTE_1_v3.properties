# =============================================================================
# straddle_config_DTE_1_v3.properties   -> use with atm_straddle_backtest_v3.py
# -----------------------------------------------------------------------------
# DTE-1 only. Same lot sizes (NIFTY 325 / SENSEX 100). All results below are on
# the actual_trades sheet basis (same fill accounting as your v2 runs),
# 2022-07-13 .. 2026-07-08, 342 trading days.
#
#                              v2 CONFIG      THIS CONFIG
#   net P&L (actual_trades)     14,76,578       42,47,801   +188%
#   net P&L (strict close-fill)  7,48,275       11,51,412   + 54%
#   win days                    263 / 342       292 / 342
#   worst single day              -22,656         -22,941
#   max drawdown                  -38,408         -24,686
#   avg attempts per day              2.2             7.4
#
# The one big idea: a PROFIT_TARGET exit used to END the day. Now the target is
# banked and the strategy re-enters one minute later at the (new) ATM. Decay on
# a DTE-1 day keeps working all session, so the day keeps harvesting 10% bites
# of premium instead of stopping after the first one. Risk is contained by the
# unchanged per-attempt stop cap, the unchanged Rs.20k daily circuit breaker,
# and a NEW day-level profit trail (peak-10k stops the day).
#
# Every change below improved BOTH fill bases and was checked across 6
# independent time blocks (all 6 improved on the sheet basis; 4 of 6 on the
# strict close basis) and every calendar year 2022-2026.
#
# CHANGED LINES ARE MARKED  ### CHANGED,  NEW LINES  ### NEW
# =============================================================================

# ---- Data location ---------------------------------------------------------
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2

# ---- Entry -----------------------------------------------------------------
# Re-tested 09:16..11:55 under the new structure; 09:20 is still the best.
ENTRY_TIME_IST=09:20

### CHANGED  15:26 -> 15:29
# With re-entry-on-target the last minutes are worth more (a fresh attempt is
# often open near the close). If you cannot reliably fill at the 15:29 close,
# use 15:28.
EXIT_TIME_IST=15:29

# Days-to-expiry to trade.
ALLOWED_DTE=1

# ---- Stop-loss -------------------------------------------------------------
# Unchanged list; the absolute cap below binds on essentially all trades.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444, 0.2555, 0.2666, 0.2776, 0.2887, 0.2998, 0.3108

### CHANGED  3500 -> 3000
# Under the new structure the tighter cap is better on both fill bases and
# cuts the max drawdown (tested 2500 / 3000 / 3500 / 4000).
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# ---- Profit-protect --------------------------------------------------------
# Unchanged. Note: with PROFIT_TARGET_PCT=0.10 the protect trail (arm 23.5%)
# can never fire - the target always hits first. Kept for safety if you ever
# raise the target or disable it.
PROFIT_PROTECT_TRIGGER_RUPEES=0.0816
PROFIT_PROTECT_ARM_PCT=0.2350
PROFIT_PROTECT_GIVEBACK_PCT=0.2000

# Breakeven ratchet: off (unchanged).
BREAKEVEN_ARM_PCT=0.0000
BREAKEVEN_LOCK_PCT=0.0000

# ---- Profit target ---------------------------------------------------------
### CHANGED  0.17 -> 0.10
# With re-entry-on-target, a smaller bite hit more often beats a bigger bite
# hit once. Tested 0.08..0.20 on both fill bases; 0.10 is best on the sheet
# basis and within noise of best on the strict close basis.
PROFIT_TARGET_PCT=0.10

### NEW  the single biggest change in v3
# A PROFIT_TARGET exit no longer ends the trading day.
REENTRY_ON_PROFIT_TARGET=1

### NEW  re-enter 1 minute after banking a target (tested 1/2/3/5/7/10).
# After a stop-loss the old 7,10,13,... ramp still applies - something adverse
# happened, waiting is right. After a target nothing adverse happened.
REENTRY_DELAY_AFTER_TARGET=1

# ---- Daily circuit breaker -------------------------------------------------
# Unchanged.
MAX_DAILY_LOSS_RUPEES=20000

### NEW  day-level profit trail
# Once the day's realized P&L reaches +10,000, stop the day if it gives back
# 10,000 from its realized peak. Cut max drawdown from -58k to -25k for ~2% of
# total profit. Set GIVEBACK to 0 to disable.
DAILY_PROFIT_TRAIL_ARM_RUPEES=10000
DAILY_PROFIT_TRAIL_GIVEBACK_RUPEES=10000

# ---- Re-entries ------------------------------------------------------------
### CHANGED  6 -> 10
# More cycles are needed now that target exits re-enter. Attempts are still
# strictly sequential - never more than one straddle open at a time.
MAX_REATTEMPTS=10

# Unchanged: delays after STOP-LOSS exits.
REENTRY_DELAY_BY_ATTEMPT= 7, 10, 13, 16, 19, 22

### NEW  skip re-entries with fewer than 10 minutes to the cutoff
# (a 5-minute stub trade mostly just pays 4 order charges).
MIN_MINUTES_LEFT_FOR_REENTRY=10

# Unchanged.
REENTRY_MAX_PREMIUM_RATIO=1.3200

# ---- Backtest window -------------------------------------------------------
LOOKBACK_MONTHS=AUTO
FAIL_ON_PICKLE_ERROR=0
