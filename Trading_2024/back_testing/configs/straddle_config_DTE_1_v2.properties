# =============================================================================
# straddle_config_DTE_1_v2.properties      -- CONFIG A (recommended)
# -----------------------------------------------------------------------------
# For atm_straddle_v2.py. Same loader as before: KEY=VALUE, one per line, real
# environment variables override this file.
#
# Backtest, expiry-1 day only, 196 days (2024-07-03 .. 2026-07-08):
#     net P&L            Rs 11,95,136      (original config: Rs 5,89,060*)
#     worst single day   Rs   -20,909      (original: Rs -22,945)
#     max drawdown       Rs    34,169      (original: Rs  55,618)
#     Sharpe (daily)               9.4     (original: 5.2)
#     winning days            153/196      (original: 136/196)
#     attempts/day                5.3      (original: 3.4)
#
#   * measured with PT_FILL_MODE=0. Under the original script's optimistic
#     intrabar fill the old config scores Rs 8,58,555 and this one Rs 11,95,994.
# =============================================================================

# ---- Data location ---------------------------------------------------------
#PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2_2years
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2

# ---- Entry -----------------------------------------------------------------
# Four minutes earlier than before. The gate below stops this becoming a blind
# sale into the opening move.
ENTRY_TIME_IST=09:16
EXIT_TIME_IST=15:25

ALLOWED_DTE=1

# ---- Entry movement gate (NEW) ---------------------------------------------
# Postpone the entry, minute by minute, while the index has travelled more than
# ENTRY_MOVE_MAX_PCT over the last ENTRY_MOVE_WINDOW_MIN minutes. Selling a
# straddle into a fast tape is what produced most of the old whipsaw stops.
ENTRY_MOVE_WINDOW_MIN=5
ENTRY_MOVE_MAX_PCT=0.12
ENTRY_MOVE_MAX_WAIT_MIN=20

# ---- Stop-loss -------------------------------------------------------------
# Effective stop = clamp(pct * premium, STOP_FLOOR_RUPEES, MAX_LOSS_LIMIT...)
# In your old config the Rs 3,000 cap bound on 100% of attempts, so the whole
# percentage list was dead configuration. Here the percentage actually bites on
# small-premium days and the cap bites on large-premium ones.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.03
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=1400
STOP_FLOOR_RUPEES=800

# ---- Per-leg roll (NEW) ----------------------------------------------------
# When the position stop is about to fire, if one leg alone has lost more than
# LEG_ROLL_PCT of the premium collected, buy back ONLY that leg and re-sell it
# at the current ATM. The untested leg keeps decaying. Used ~500 times in the
# backtest; without it the result drops by about 22%.
LEG_ROLL_PCT=0.005
MAX_LEG_ROLLS=1

# ---- Profit-protect --------------------------------------------------------
# The single biggest change. The old script forced the arm level and the
# give-back to be the same number, so it armed early and then handed back the
# same amount it had armed at - Rs 7.95 lakh of peak profit was returned across
# 126 exits. Now the trail arms LATE (18% of premium) and gives back only 3%.
# This is where the extra profit comes from: 117 such exits, average +Rs 12,318.
PP_ARM_PCT=0.18
PP_GIVEBACK_PCT=0.03
# kept for backward compatibility; PP_ARM_PCT/PP_GIVEBACK_PCT take precedence
PROFIT_PROTECT_TRIGGER_RUPEES=0.18

# ---- Profit target ---------------------------------------------------------
# Now only a safety valve (it fires once in 196 days). The trail above is the
# real exit. A low target actively destroys the edge - it caps the winners that
# pay for the many small stops.
PROFIT_TARGET_PCT=0.50
REENTER_AFTER_PROFIT_TARGET=0

# ---- Profit-target fill model (NEW, IMPORTANT) -----------------------------
# 0 = the target must be reached by the 1-minute CLOSE of the straddle.
# 1 = legacy: allows a fill at CE_low + PE_low of the same minute.
# The two legs do not print their lows at the same instant, so mode 1 prices a
# fill you cannot get. It inflated the old result by 31%. Leave this at 0.
PT_FILL_MODE=0

# ---- Daily risk ------------------------------------------------------------
MAX_DAILY_LOSS_RUPEES=20000

# ---- Daily trailing profit lock (NEW) --------------------------------------
# Once the day has realised DAILY_LOCK_ARM_RUPEES, stop trading if it gives back
# DAILY_LOCK_GIVEBACK_RUPEES from that peak. Protects good days from a late
# reversal without capping them.
DAILY_LOCK_ARM_RUPEES=25000
DAILY_LOCK_GIVEBACK_RUPEES=6000

# ---- Re-entries ------------------------------------------------------------
MAX_REATTEMPTS=20
REENTRY_DELAY_BY_ATTEMPT=4

# ---- Slippage (NEW) --------------------------------------------------------
# Points given up per leg per side, charged on entry, exit and every roll.
# Set to 0 to match your original assumption. Realistic values are roughly
# 0.10-0.25 for NIFTY and 1.0-2.0 for SENSEX - see the summary document, this
# strategy is materially sensitive to them.
SLIPPAGE_POINTS_NIFTY=0
SLIPPAGE_POINTS_SENSEX=0
SLIPPAGE_STOP_MULT=1.0

# ---- Backtest window -------------------------------------------------------
LOOKBACK_MONTHS=AUTO
FAIL_ON_PICKLE_ERROR=0
