# =============================================================================
# straddle_config_DTE_1_v2.properties      -> use with atm_straddle_backtest_v2.py
# -----------------------------------------------------------------------------
# DTE-1 only. Same lot sizes. Rs.3,000 per-attempt stop cap unchanged.
#
# Backtested 2024-07-03 .. 2026-07-08, 196 trading days, actual_trades basis:
#
#                        ORIGINAL      THIS CONFIG
#   net P&L (your basis)  8,58,555      10,25,766     +19.5%
#   net P&L (realistic)   5,89,060       9,22,806     +56.7%
#   worst single day       -22,945        -16,561
#   max drawdown            55,617         38,774
#   trades                     674            929
#
# Beats the original in ALL 6 independent time blocks on both fill assumptions,
# and its margin widens as slippage rises.
#
# CHANGED LINES ARE MARKED  ### CHANGED
# =============================================================================

# ---- Data location ---------------------------------------------------------
#PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2_2years
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2

# ---- Entry -----------------------------------------------------------------
ENTRY_TIME_IST=09:20

### CHANGED  15:25 -> 15:29
# Worth +Rs.1.1 lakh on its own. Positions that are still working at 15:25 were
# being force-closed 4 minutes before the last of the day's decay. The gain is
# broad, not a one-day artifact: 96 days improved, 40 worsened, 60 unchanged,
# and the effect rises smoothly from 15:21 to 15:29.
# If you cannot reliably fill at the 15:29 close, use 15:28 (approx Rs.44k less).
EXIT_TIME_IST=15:26

# Days-to-expiry to trade.
ALLOWED_DTE=1

# ---- Stop-loss -------------------------------------------------------------
# NOTE: this list has NO EFFECT at these premium levels. The Rs.3,000 cap below
# binds on 100% of trades (the smallest premium seen was Rs.27,788; 24.44% of
# that is Rs.6,791, still above the cap). Do not spend time tuning it unless you
# drop it below roughly 4.5%, which only makes stops tighter.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444, 0.2555, 0.2666, 0.2776, 0.2887, 0.2998, 0.3108

# Rs.3,000 is genuinely the right number. Tested 2,000 / 2,500 / 4,000 / 5,000 /
# 6,000 / 8,000 / 10,000 -- every one is worse AND carries a bigger worst day.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3500

# ---- Profit-protect --------------------------------------------------------
# Kept only so the v2 script has a fallback if the two keys below are removed.
PROFIT_PROTECT_TRIGGER_RUPEES=0.0816

### CHANGED  arm and giveback are now separate (this is the single biggest win)
# The old setting used 8.16% for BOTH. That means a trade had to gain 8.16% of
# premium to arm the trail, then handed all 8.16% back before exiting -- so a
# winner routinely round-tripped to zero. 126 such trades banked Rs.1.97 lakh
# but were worth Rs.4.09 lakh if held.
# Now: arm later (10%), give back far less (2.5%).
PROFIT_PROTECT_ARM_PCT=0.2350
PROFIT_PROTECT_GIVEBACK_PCT=0.2000

### CHANGED (new) breakeven ratchet
# Once peak profit on an attempt reaches 4% of premium collected, the stop floor
# moves from -Rs.3,000 to breakeven. A trade that ran into profit can no longer
# come back as a full loss. Survived walk-forward: helped 5 of 6 time blocks,
# cut max drawdown ~30% and the worst day from -22,945 to -16,561.
BREAKEVEN_ARM_PCT=0.0000
BREAKEVEN_LOCK_PCT=0.0000
# ---- Profit target (ends the day) -----------------------------------------
# Unchanged. Tested 0.10 through 0.80 and "off"; 0.2295 is already near optimal.
PROFIT_TARGET_PCT=0.1700

# ---- Daily circuit breaker -------------------------------------------------
### CHANGED  30000 -> 15000
# The old limit NEVER fired in 2 years, so it was doing nothing. At 15,000 it
# caps the worst day without measurably costing profit.
MAX_DAILY_LOSS_RUPEES=20000

# ---- Re-entries ------------------------------------------------------------
# Unchanged. Tested 0-30; 6 is best. Also tested flat delays of 3/5/8/10/15/20/30
# minutes and several ramps -- your existing ramp is the best of them.
MAX_REATTEMPTS=6
REENTRY_DELAY_BY_ATTEMPT= 7, 10, 13, 16, 19, 22

# Optional: stop re-entering when the fresh ATM straddle is more than this
# multiple of the one just stopped out of. Tested 1.05-2.0; effect was inside
# noise, so it ships disabled.
REENTRY_MAX_PREMIUM_RATIO=1.3200

# ---- Backtest window -------------------------------------------------------
LOOKBACK_MONTHS=AUTO
FAIL_ON_PICKLE_ERROR=0
