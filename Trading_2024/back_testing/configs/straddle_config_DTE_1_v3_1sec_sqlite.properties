# =============================================================================
# DTE-1 V3 STRADDLE — ONE-SECOND SQLITE BACKTEST CONFIGURATION
# Use with: atm_straddle_backtest_v3_1sec_sqlite.py
# Input databases: KiteOptions1SecSpikeCollector_v3_1_oUtils_target.py
# =============================================================================

# ---- One-second SQLite data -------------------------------------------------
# Directory containing collector databases such as:
#   kite_option_spikes_v3_NIFTY_20260805.sqlite3
# Change this path to the folder where collector C writes its databases.
SQLITE_DIR=G:\My Drive\Trading\Kite_tick-data
SQLITE_GLOB=kite_option_spikes_v3_*.sqlite3
SQLITE_RECURSIVE=1

# Collector C currently writes schema version 3.
REQUIRE_COLLECTOR_SCHEMA_VERSION=3

# 0 = continue past a malformed database and record it in the skipped sheet.
# 1 = stop immediately on the first database error.
FAIL_ON_DB_ERROR=0

# Data-quality switches. They do not alter strategy thresholds.
# Collector databases are receipt-time LTP data and can contain reconnects.
SKIP_DAY_ON_RECONNECT=0
SKIP_DAY_ON_FEED_ERROR=0

# Maximum age of a carried-forward option LTP allowed at entry/re-entry.
# 0 disables the age filter, which is appropriate for the collector's default
# SAVE_ONLY_PRICE_CHANGES=true mode. Set, for example, 30 for stricter tests.
MAX_ENTRY_PRICE_AGE_SECONDS=0

# ---- Session and entry ------------------------------------------------------
# On one-second data, HH:MM means HH:MM:00. HH:MM:SS is also accepted.
SESSION_START=09:15:00
SESSION_END=15:30:00
ENTRY_TIME_IST=09:16:00
EXIT_TIME_IST=15:29:00
ALLOWED_DTE=0

# ---- Stop-loss --------------------------------------------------------------
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444,0.2555,0.2666,0.2776,0.2887,0.2998,0.3108,0.3108,0.3108,0.3108,0.3108,0.3108,0.3108,0.3108,0.3108,0.3108
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=4500

# ---- Profit protection and breakeven ---------------------------------------
PROFIT_PROTECT_TRIGGER_RUPEES=0.0816
PROFIT_PROTECT_ARM_PCT=0.2350
PROFIT_PROTECT_GIVEBACK_PCT=0.2000
BREAKEVEN_ARM_PCT=0.0000
BREAKEVEN_LOCK_PCT=0.0000

# ---- Profit target and target recycling ------------------------------------
# Strategy parity with uploaded A is preserved: target detection uses CE low +
# PE low from the same one-second bucket and books the exact target amount.
PROFIT_TARGET_PCT=0.0500
REENTRY_ON_PROFIT_TARGET=1
REENTRY_DELAY_AFTER_TARGET=1

# ---- Daily controls ---------------------------------------------------------
MAX_DAILY_LOSS_RUPEES=20000
DAILY_PROFIT_TRAIL_ARM_RUPEES=10000
DAILY_PROFIT_TRAIL_GIVEBACK_RUPEES=10000

# ---- Re-entry controls ------------------------------------------------------
# MAX_REATTEMPTS=15 permits at most 16 sequential attempts including the first.
MAX_REATTEMPTS=15
REENTRY_DELAY_BY_ATTEMPT=6,6,6,6,6,6,6,6,6,6,6,6,6,6,6,6
MIN_MINUTES_LEFT_FOR_REENTRY=0
REENTRY_MAX_PREMIUM_RATIO=1.6900

# ---- Quantities and strike steps -------------------------------------------
# Retained from the one-minute strategy. Adjust only if your traded quantities
# differ from the optimized backtest quantities.
NIFTY_QTY_UNITS=325
SENSEX_QTY_UNITS=100
NIFTY_STRIKE_STEP=50
SENSEX_STRIKE_STEP=100

# ---- Transaction costs ------------------------------------------------------
INCLUDE_TRANSACTION_COSTS=1
BROKERAGE_PER_ORDER=20
ORDERS_PER_TRADE=4
STT_SELL_PCT=0.001
EXCHANGE_TXN_PCT=0.0003553
SEBI_PER_CRORE=10
STAMP_BUY_PCT=0.00003
IPFT_PER_CRORE=0.010
GST_PCT=0.18

# ---- Backtest window and output --------------------------------------------
LOOKBACK_MONTHS=AUTO
# OUTPUT_XLSX=G:\My Drive\Trading\Results\short_straddle_v3_1sec_sqlite.xlsx
