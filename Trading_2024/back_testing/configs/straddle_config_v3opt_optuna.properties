# =============================================================================
# straddle_config_v3opt.properties
# For atm_straddle_expiry_day_V3OPT.py (V2-OPT + per-underlying profiles)
#
# Backtest 2024-07-04 .. 2026-07-09, same pickles, same lots, full costs:
#   Original baseline : Rs. 13.95L
#   V2-OPT            : Rs. 25.91L   (your run: 25.41L with Kite spot)
#   V3-OPT (this)     : Rs. 27.23L   (+5.1% vs V2-OPT; +93% vs original)
#
# WHAT CHANGED vs straddle_config_v2opt.properties (all else identical):
#   NIFTY : profit-protect arm/giveback 0.3755 -> 0.33; once armed, giveback
#           tightens to 0.30 after 14:30 (new PROFIT_PROTECT_LATE_GIVEBACK);
#           late 50% target starts 14:30 (was 14:15); daily loss cap 27000
#           (also improves worst day: -28.9k vs -32.4k on NIFTY days)
#   SENSEX: profit target 0.75 -> 0.72; late 50% target starts 14:00
# =============================================================================
# ---- Run control -------------------------------------------------------------
# optimize = run Optuna; backtest = run one normal Excel backtest.
RUN_MODE=optimize

# ---- Optimizer execution -----------------------------------------------------
# V3 has a materially wider search space than the earlier six-parameter model.
OPT_TRIALS=1000
OPT_CV_FOLDS=1
OPT_CV_PENALTY=0.15
OPT_SEED=42
OPT_STARTUP_TRIALS=50
OPT_PROGRESS_EVERY=1

# Persist every trial and keep a resumable Optuna study.
OPT_OUTPUT_DIR=G:\My Drive\Trading\optimizer_runs
OPT_STUDY_NAME=short_straddle_v3opt_expiry0
OPT_SAVE_DB=1

# Smoke test: use e.g. 3 pickles and 20 dates; leave blank for the full run.
SAMPLE_MAX_PICKLES=
SAMPLE_MAX_DAYS=

# Freeze any entire parameter group by changing 1 to 0.
OPT_TUNE_TIMES=1
OPT_TUNE_STOPLOSS=1
OPT_TUNE_REENTRY=1
OPT_TUNE_PROFILES=1
OPT_TUNE_DAILY_LOSS=1

# Activity guards for a full-data optimization.
OPT_MIN_DAYS=100
OPT_MIN_MONTHS=6

# ---- Principal search ranges -------------------------------------------------
OPT_ENTRY_FROM_IST=09:15
OPT_ENTRY_TO_IST=10:15
OPT_ENTRY_STEP_MIN=1
OPT_EXIT_FROM_IST=15:00
OPT_EXIT_TO_IST=15:30
OPT_EXIT_STEP_MIN=1

OPT_SL_BASE_MIN=0.20
OPT_SL_BASE_MAX=0.60
OPT_SL_STEP_MIN=0.00
OPT_SL_STEP_MAX=0.08
OPT_STOP_CAP_MIN=2000
OPT_STOP_CAP_MAX=5000
OPT_STOP_CAP_STEP=250

OPT_REATTEMPTS_MIN=3
OPT_REATTEMPTS_MAX=12
OPT_REENTRY_DELAY_MIN=1
OPT_REENTRY_DELAY_MAX=15
OPT_REENTRY_STEP_MIN=0
OPT_REENTRY_STEP_MAX=3
OPT_TARGET_REENTRY_DELAY_MIN=1
OPT_TARGET_REENTRY_DELAY_MAX=10
OPT_MOMENTUM_LOOKBACK_MIN=1
OPT_MOMENTUM_LOOKBACK_MAX=8

OPT_PROTECT_MIN=0.20
OPT_PROTECT_MAX=0.50
OPT_LATE_GIVEBACK_MIN=0.00
OPT_LATE_GIVEBACK_MAX=0.45
OPT_TARGET_MIN=0.55
OPT_TARGET_MAX=0.90
OPT_LATE_TARGET_MIN=0.30
OPT_LATE_TARGET_MAX=0.65
OPT_LATE_FROM_IST=13:30
OPT_LATE_TO_IST=15:00
OPT_LATE_TIME_STEP_MIN=5

OPT_DAILY_LOSS_MIN=15000
OPT_DAILY_LOSS_MAX=40000
OPT_DAILY_LOSS_STEP=1000


# ---- Data location ---------------------------------------------------------
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2
#PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1_2_2years

# ---- Entry (both underlyings) ------------------------------------------------
ENTRY_TIME_IST=09:19
EXIT_TIME_IST=15:25
ENTRY_MOMENTUM_GATE=1
MOMENTUM_LOOKBACK_MIN=3
ALLOWED_DTE=0

# ---- Stop-loss (unchanged) ----------------------------------------------------
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.3716, 0.3969, 0.4222, 0.4475, 0.4728, 0.4982, 0.5235, 0.5488
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# ---- Shared defaults (used where no per-underlying override exists) -----------
PROFIT_PROTECT_TRIGGER_RUPEES=0.3755
PROFIT_TARGET_PCT=0.75
PROFIT_TARGET_PCT_LATE=0.50
PROFIT_TARGET_LATE_FROM_IST=14:15
PROFIT_TARGET_REENTRY_ENABLED=1
PROFIT_TARGET_REENTRY_DELAY=3
MAX_DAILY_LOSS_RUPEES=30000
MAX_REATTEMPTS=10
REENTRY_DELAY_BY_ATTEMPT=7, 7, 7, 7, 7, 7, 7, 7

# ---- NIFTY profile -------------------------------------------------------------
NIFTY_PROFIT_PROTECT_TRIGGER_RUPEES=0.33
NIFTY_PROFIT_PROTECT_LATE_GIVEBACK=0.30
NIFTY_PROFIT_PROTECT_LATE_FROM_IST=14:30
NIFTY_PROFIT_TARGET_LATE_FROM_IST=14:30
NIFTY_MAX_DAILY_LOSS_RUPEES=27000

# ---- SENSEX profile -------------------------------------------------------------
SENSEX_PROFIT_TARGET_PCT=0.72
SENSEX_PROFIT_TARGET_LATE_FROM_IST=14:00

# ---- Backtest window --------------------------------------------------------------
LOOKBACK_MONTHS=AUTO
FAIL_ON_PICKLE_ERROR=0
# OUTPUT_XLSX=
