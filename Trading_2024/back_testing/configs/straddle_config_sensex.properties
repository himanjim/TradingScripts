# =============================================================================
# SENSEX configuration for atm_straddle_multi_underlying_config_backtest.py
# =============================================================================
# Format: KEY=VALUE.  Keep this file beside the Python script, or list its full
# path in STRADDLE_CONFIG_FILES.  Comma-separated schedules are indexed from
# the initial attempt; values beyond a schedule reuse its last item.

# This worker processes SENSEX rows only.
TARGET_UNDERLYING=SENSEX

# Folder containing option-data pickle files (*.pkl / *.pickle).
PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1

# Trading window in IST.  No fresh entry/re-entry starts at or after exit time.
ENTRY_TIME_IST=11:45
EXIT_TIME_IST=15:25

# Expiry day only.  Use 0,1 to include the day before expiry.
ALLOWED_DTE=0

# Per-attempt stop as a fraction of premium collected (initial + re-entries).
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.3064,0.3816,0.4569,0.5322,0.6075,0.6828,0.758,0.8333,0.9086,0.95,0.95

# Absolute rupee cap on the percentage stop; 0 disables the cap.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# Profit-protect arm and trailing give-back, as a fraction of premium.
PROFIT_PROTECT_TRIGGER_RUPEES=0.350939

# Per-attempt profit target as a fraction of premium; reaching it ends the day.
PROFIT_TARGET_PCT=0.616875

# Stop trading after this cumulative realized daily loss; 0 disables.
MAX_DAILY_LOSS_RUPEES=30000

# Ten re-entries after the initial attempt, each delayed by four minutes.
MAX_REATTEMPTS=10
REENTRY_DELAY_BY_ATTEMPT=4,4,4,4,4,4,4,4,4,4,4

# AUTO uses the full usable date range found in the pickle files.
LOOKBACK_MONTHS=AUTO

# 1 aborts on a bad pickle; 0 records/skips it and continues.
FAIL_ON_PICKLE_ERROR=0
