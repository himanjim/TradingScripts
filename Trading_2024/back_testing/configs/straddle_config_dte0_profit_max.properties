# DTE-0 PROFIT-MAX TARGET-REENTRY CONFIGURATION
# Same Dhan A-compat pickle archive and unchanged QTY_UNITS/lots.
#
# Aggressive but source-engine-verified profile: it permits up to 20 sequential
# re-entries and retains the supplied engine's intraminute PROFIT_TARGET fill
# convention. Transaction charges are included, but live bid/ask slippage and
# leg-fill sequencing are not present in the pickle bars. Use the balanced
# configuration for a lower-turnover operating starting point.
# =============================================================================

