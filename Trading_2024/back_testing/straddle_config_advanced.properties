# =============================================================================
# straddle_config.properties
# -----------------------------------------------------------------------------
# Configuration for atm_straddle_claude_reattempt_pct_risk_attemptwise.py
#
# Format : KEY=VALUE, one setting per line.
# Comments begin with # or ;.
#
# Loading:
#   1. Keep this file in the SAME folder as the Python script; or
#   2. set STRADDLE_CONFIG to its complete path.
#
# A real operating-system environment variable overrides the corresponding
# property below.
#
# ATTEMPT NUMBERING USED BY ALL ARRAYS:
#   value 1 = original entry
#   value 2 = first re-entry
#   value 3 = second re-entry
#   ...
# MAX_REATTEMPTS=7 permits 8 total attempts, so eight values are shown below.
# If fewer values are supplied, the script reuses the LAST value for all later
# attempts. A single scalar value is therefore still valid and applies to every
# attempt.
# =============================================================================

# ---- Data location ---------------------------------------------------------
# Folder containing option-data pickle files (*.pkl / *.pickle).
# PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New
 PICKLES_DIR=G:\My Drive\Trading\Dhan_Historical_Options_Data_New_0_1
#PICKLES_DIR=G:\My Drive\Trading\Historical_Options_Data

# ---- Entry and forced exit -------------------------------------------------
# Time of the original straddle entry each day, IST, HH:MM.
ENTRY_TIME_IST=09:50

# Hard strategy square-off time, IST, HH:MM.
# No new entry/re-entry is initiated at or after this time. Any attempt still
# open at this time is exited with exit_reason=TIME_EXIT.
EXIT_TIME_IST=15:25

# Days-to-expiry eligible for the actual traded book.
#   0   = expiry day only
#   0,1 = expiry day and the preceding day
ALLOWED_DTE=0

# ---- Per-attempt stop-loss -------------------------------------------------
# Percentage of the premium collected on each attempt.
# Accepts decimals (0.25) or percentages (25).
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2659, 0.3499, 0.4339, 0.5179, 0.6019, 0.6859, 0.7699, 0.854

# Absolute rupee cap on the percentage-derived stop-loss for each attempt.
# Effective stop = min(stop percentage * entry premium, this cap).
# Set 0 to disable the cap.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# ---- Per-attempt profit protection ----------------------------------------
# For each attempt, G = configured percentage * premium collected.
# Profit protection arms when peak gross P&L reaches G and exits when P&L falls
# to peak minus G. Set an individual value to 0 to disable protection only for
# that attempt.
#
# Replace the values below with the schedule printed by the new optimizer.
# Repeated values preserve the previous single-value behaviour.
PROFIT_PROTECT_TRIGGER_RUPEES=0.25, 0.425, 0.7, 0.775, 0.6, 0.125, 0.4, 0.1

# ---- Per-attempt profit target --------------------------------------------
# Percentage of the premium collected on the ACTIVE attempt.
# When reached, that attempt exits with PROFIT_TARGET and no further trade is
# taken on that day. Set an individual value to 0 to disable the target only for
# that attempt.
#
# Replace the values below with the schedule printed by the new optimizer.
# Repeated values preserve the previous single-value behaviour.
PROFIT_TARGET_PCT=0.425, 0.825, 0.7, 0.8, 0.475, 0.275, 0.825, 0.35

# ---- Daily circuit breaker -------------------------------------------------
# Stop further entries after cumulative realized NET P&L reaches this loss.
# Set 0 to disable.
MAX_DAILY_LOSS_RUPEES=30000

# ---- Re-entries ------------------------------------------------------------
# Maximum number of re-entries after STOPLOSS or PROFIT_PROTECT.
# Total possible attempts = MAX_REATTEMPTS + 1.
MAX_REATTEMPTS=7

# Delay after each eligible exit before the next re-entry, in minutes.
# Value 1 is the delay before the first re-entry.
REENTRY_DELAY_BY_ATTEMPT=1, 2, 3, 4, 5, 6, 7, 8

# ---- Backtest window -------------------------------------------------------
# AUTO uses the full date range available in the pickle data. A numeric value
# limits the test to that many months ending on the latest available data date.
LOOKBACK_MONTHS=AUTO

# ---- Error handling and output --------------------------------------------
# 1 = abort on a bad pickle; 0 = report it and continue.
FAIL_ON_PICKLE_ERROR=0

# Optional complete output path. Leave commented for automatic output into the
# current user's Downloads directory.
# OUTPUT_XLSX=G:\My Drive\Trading\results\attemptwise_backtest.xlsx
