# =============================================================================
# live_trader_config.properties
# DTE-1 v3 live/paper configuration for live_short_straddle_trader.py
# Strategy source: atm_straddle_backtest_v3.py + straddle_config_DTE_1_v3.properties
# =============================================================================

# ---- HARD SAFETY MODE -------------------------------------------------------
# 1 = PAPER: no Zerodha order is transmitted. 0 = LIVE real orders.
# Keep paper mode enabled until tick/fill logs have been verified across several
# DTE-1 sessions.
PAPER_TRADING=1

# ---- Underlying and DTE selection ------------------------------------------
# AUTO mirrors the backtest actual-trade selector among NIFTY and SENSEX.
UNDERLYING_MODE=AUTO
ALLOWED_DTE=1
ENFORCE_DTE=1

# ---- Entry and hard exit ----------------------------------------------------
ENTRY_TIME_IST=09:20
EXIT_TIME_IST=15:29
# Refuse a fresh first entry when the process starts materially late.
# Set 0 to disable this operational guard.
MAX_LATE_START_MINUTES=15

# ---- Attempt stop-loss ------------------------------------------------------
# Percentage of collected premium; later attempts reuse the last list value.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444,0.2555,0.2666,0.2776,0.2887,0.2998,0.3108
# Effective stop = min(percentage stop, absolute cap).
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# ---- Profit-protect and breakeven ------------------------------------------
# Legacy fallback retained for compatibility. Explicit arm/give-back values below
# control the v3 strategy.
PROFIT_PROTECT_TRIGGER_RUPEES=0.0816
PROFIT_PROTECT_ARM_PCT=0.2350
PROFIT_PROTECT_GIVEBACK_PCT=0.2000
BREAKEVEN_ARM_PCT=0.0000
BREAKEVEN_LOCK_PCT=0.0000

# ---- Profit target and target re-entry -------------------------------------
PROFIT_TARGET_PCT=0.10
REENTRY_ON_PROFIT_TARGET=1
REENTRY_DELAY_AFTER_TARGET=1

# ---- Day-level risk controls ------------------------------------------------
MAX_DAILY_LOSS_RUPEES=20000
DAILY_PROFIT_TRAIL_ARM_RUPEES=10000
DAILY_PROFIT_TRAIL_GIVEBACK_RUPEES=10000

# ---- Re-entry controls ------------------------------------------------------
# MAX_REATTEMPTS=10 means at most 11 total sequential attempts including the first.
MAX_REATTEMPTS=10
# Used after STOPLOSS and PROFIT_PROTECT; later re-entries reuse the last value.
REENTRY_DELAY_BY_ATTEMPT=7,10,13,16,19,22
# Do not schedule a re-entry with fewer than this many minutes before EXIT_TIME.
MIN_MINUTES_LEFT_FOR_REENTRY=10
# Stop the day if the fresh ATM premium is above this multiple of the previous
# attempt's entry premium. Set 0 to disable.
REENTRY_MAX_PREMIUM_RATIO=1.3200

# ---- Live feed / paper fills ------------------------------------------------
MONITOR_POLL_SECONDS=0.20
MONITOR_HEARTBEAT_SECONDS=5
PAPER_SLIPPAGE_TICKS=1
OPTION_TICK=0.05

# ---- Hardened order execution ----------------------------------------------
ORDER_STATUS_POLL_SECONDS=0.50
ORDER_STATUS_MAX_POLLS=20
ORDER_CONFIRM_TIMEOUT_SECONDS=12
ENTRY_EXECUTION_MAX_ATTEMPTS=4
ENTRY_EXECUTION_RETRY_DELAY_SECONDS=2
AMBIGUOUS_ORDER_RECONCILE_SECONDS=8
CLEANUP_MAX_ATTEMPTS=4
CLEANUP_VERIFY_DELAY_SECONDS=0.75
ORDER_PRODUCT=NRML

# ---- Zerodha/API resilience: all retry budgets are finite ------------------
API_MAX_RETRIES=5
API_ORDER_MAX_RETRIES=3
API_RETRY_BACKOFF_SECONDS=2
API_RETRY_BACKOFF_MAX=15
API_HTTP_TIMEOUT_SECONDS=10
PROCESS_RESTART_MAX_ATTEMPTS=3
PROCESS_RESTART_DELAY_SECONDS=5
REST_MIN_INTERVAL_SECONDS=0.35

# ---- Estimated transaction costs ------------------------------------------
# Used only for realised NET P&L, daily loss breaker and day-profit trail.
INCLUDE_TRANSACTION_COSTS=1
BROKERAGE_PER_ORDER=20
ORDERS_PER_TRADE=4
STT_SELL_PCT=0.0015
NFO_TXN_PCT=0.0003553
BFO_TXN_PCT=0.0003250
SEBI_PER_CRORE=10
STAMP_BUY_PCT=0.00003
NFO_IPFT_PER_CRORE=0.010
GST_PCT=0.18

# ---- Files and logging ------------------------------------------------------
# LOG_FILE=C:\Users\himan\short_straddle_dte1_v3_live.log
# STATE_FILE=C:\Users\himan\short_straddle_dte1_v3_state.json
