# =============================================================================
# PAPER-ONLY LIVE-MARKET TEST — DTE-0 / DTE-1 / DTE-2 SHORT STRADDLE
# =============================================================================
# This file is intentionally paper-only. The corresponding Python program has
# no broker order-placement functions and will refuse PAPER_ONLY=0.
# =============================================================================

# ---- Hard safety lock -------------------------------------------------------
PAPER_ONLY=1

# ---- Strategy opportunity selection ---------------------------------------
ALLOWED_DTE=0,1,2,3,4
# NEAREST_EXPIRY_ONE mirrors the backtest: select one qualifying underlying;
# if expiry is tied, use TRADE_PRIORITY.
TRADE_SELECTION=NEAREST_EXPIRY_ONE
TRADE_PRIORITY=NIFTY,SENSEX

# SKIP preserves the exact configured first-entry time. ENTER_IMMEDIATELY is
# useful only for an intentional mid-session diagnostic run.
LATE_START_MODE=ENTER_IMMEDIATELY

# ---- Output and restart state ----------------------------------------------
# OUTPUT_ROOT=C:\Users\himan\paper_straddle_live_tests
# STATE_FILE=C:\Users\himan\paper_straddle_live_tests\paper_short_straddle_state.json
RESUME_TODAY_STATE=1
GENERATE_EXCEL_ON_EXIT=1
LOG_RAW_TICKS=1

# ---- Quote synchronisation and evaluation ---------------------------------
MONITOR_POLL_SECONDS=0.20
HEARTBEAT_SECONDS=5
STATE_SAVE_SECONDS=5
QUOTE_WAIT_SECONDS=15
MAX_QUOTE_AGE_SECONDS=2.5
MAX_LEG_QUOTE_SKEW_MS=1500

# Paper fills walk five-level depth. Entry is rejected when displayed depth is
# insufficient. Exit shortfall is valued beyond the worst visible quote.
REQUIRE_FULL_DEPTH_AT_ENTRY=1
ALLOW_LTP_FALLBACK=0
ENTRY_SLIPPAGE_TICKS=1
EXIT_SLIPPAGE_TICKS=1
DEPTH_SHORTFALL_PENALTY_TICKS=4

# ---- NIFTY base profile -----------------------------------------------------
# Applied to DTE-0, DTE-1 and DTE-2 unless a DTE-specific override is set.
# Example override: NIFTY_DTE1_PROFIT_TARGET_PCT=0.10
NIFTY_SPOT_KEY=NSE:NIFTY 50
NIFTY_OPTIONS_EXCHANGE=NFO
NIFTY_OPTION_NAME=NIFTY
NIFTY_STRIKE_STEP=50
NIFTY_QTY_UNITS=325
NIFTY_ENTRY_TIME_IST=09:38
NIFTY_EXIT_TIME_IST=15:15
NIFTY_REENTRY_CUTOFF_TIME_IST=15:12
NIFTY_STOP_PCT_BY_ATTEMPT=0.3716,0.3969,0.4222,0.4475,0.4728,0.4982,0.5235,0.5488
NIFTY_STOP_CAP_RUPEES=3300
NIFTY_PROFIT_PROTECT_PCT=0.355
NIFTY_PROFIT_TARGET_PCT=0.12
NIFTY_PROFIT_TARGET_REENTRY_ENABLED=1
NIFTY_PROFIT_TARGET_REENTRY_DELAY_BY_ATTEMPT=1
NIFTY_RISK_REENTRY_DELAY_BY_ATTEMPT=8,8,8,8,8,8,8,8
NIFTY_MAX_REATTEMPTS=20
NIFTY_MAX_DAILY_LOSS_RUPEES=30000

# ---- SENSEX base profile ---------------------------------------------------
# Applied to DTE-0, DTE-1 and DTE-2 unless a DTE-specific override is set.
# Example override: SENSEX_DTE2_ENTRY_TIME_IST=10:05
SENSEX_SPOT_KEY=BSE:SENSEX
SENSEX_OPTIONS_EXCHANGE=BFO
SENSEX_OPTION_NAME=SENSEX
SENSEX_STRIKE_STEP=100
SENSEX_QTY_UNITS=100
SENSEX_ENTRY_TIME_IST=10:00
SENSEX_EXIT_TIME_IST=15:23
SENSEX_REENTRY_CUTOFF_TIME_IST=15:10
SENSEX_STOP_PCT_BY_ATTEMPT=0.3716,0.3969,0.4222,0.4475,0.4728,0.4982,0.5235,0.5488
SENSEX_STOP_CAP_RUPEES=2350
SENSEX_PROFIT_PROTECT_PCT=0.360
SENSEX_PROFIT_TARGET_PCT=0.08
SENSEX_PROFIT_TARGET_REENTRY_ENABLED=1
SENSEX_PROFIT_TARGET_REENTRY_DELAY_BY_ATTEMPT=1
