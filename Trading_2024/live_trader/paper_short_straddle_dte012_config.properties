SENSEX_MAX_REATTEMPTS=20
SENSEX_MAX_DAILY_LOSS_RUPEES=30000

# ---- Optional DTE-specific overrides ---------------------------------------
# Any base strategy key can be overridden for a particular DTE by inserting
# DTE0, DTE1 or DTE2 between the underlying and the key. Unspecified values
# fall back to the base profile above.
#
# Examples:
# NIFTY_DTE0_PROFIT_TARGET_PCT=0.12
# NIFTY_DTE1_PROFIT_TARGET_PCT=0.10
# NIFTY_DTE2_PROFIT_TARGET_PCT=0.08
# SENSEX_DTE1_STOP_CAP_RUPEES=2500
# SENSEX_DTE2_MAX_REATTEMPTS=10
#
# Supported suffixes:
# ENTRY_TIME_IST, EXIT_TIME_IST, REENTRY_CUTOFF_TIME_IST,
# STOP_PCT_BY_ATTEMPT, STOP_CAP_RUPEES, PROFIT_PROTECT_PCT,
# PROFIT_TARGET_PCT, PROFIT_TARGET_REENTRY_ENABLED,
# PROFIT_TARGET_REENTRY_DELAY_BY_ATTEMPT, RISK_REENTRY_DELAY_BY_ATTEMPT,
# MAX_REATTEMPTS, MAX_DAILY_LOSS_RUPEES

