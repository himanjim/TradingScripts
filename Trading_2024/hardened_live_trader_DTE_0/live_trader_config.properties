# =============================================================================
# live_trader_config.properties
# Live/paper configuration for live_short_straddle_trader.py
# Strategy: atm_straddle_expiry_day_V3OPT.py + straddle_config_v3opt_DTE0.properties
# =============================================================================

# ---- HARD SAFETY MODE -------------------------------------------------------
# 1 = PAPER: no order is transmitted to Zerodha.
# 0 = LIVE: real orders are placed.
# Keep this at 1 until paper behaviour has been verified across multiple expiries.
PAPER_TRADING=1

# ---- Underlying selection ---------------------------------------------------
# AUTO mirrors the backtest actual-trade selector: among NIFTY/SENSEX, select
# the nearest expiry whose DTE is included in ALLOWED_DTE; ties prefer NIFTY.
# With ALLOWED_DTE=0, the program runs only on the index expiring today.
UNDERLYING_MODE=AUTO
ALLOWED_DTE=0
ENFORCE_DTE=1

# ---- Entry and exit ---------------------------------------------------------
ENTRY_TIME_IST=09:16
EXIT_TIME_IST=15:26

# First entry and every re-entry wait until current ATM CE+PE premium is below
# its level MOMENTUM_LOOKBACK_MIN minutes earlier.
ENTRY_MOMENTUM_GATE=1
MOMENTUM_LOOKBACK_MIN=8

# Operational guard: if the process starts much later than ENTRY_TIME_IST and
# there is no prior state/order history, do not open a materially late first trade.
# 0 disables this guard.
MAX_LATE_START_MINUTES=15

# ---- Stop-loss --------------------------------------------------------------
# Percentage of premium collected on each attempt. Attempt indexes beyond the
# list reuse the final value.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.5877,0.6054,0.6230,0.6406,0.6583,0.6759,0.6935,0.7112,0.7288,0.7464,0.7464,0.7464,0.7464

# Effective stop = min(stop percentage * collected premium, this cap).
# 0 disables the absolute cap.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3000

# ---- Shared V3OPT defaults --------------------------------------------------
# Despite the historical key name, this is a FRACTION of collected premium.
PROFIT_PROTECT_TRIGGER_RUPEES=0.3755

PROFIT_TARGET_PCT=0.75
PROFIT_TARGET_PCT_LATE=0.50
PROFIT_TARGET_LATE_FROM_IST=14:15

# A target exit may recycle into a new ATM straddle after the configured delay,
# subject to the momentum gate and MAX_REATTEMPTS.
PROFIT_TARGET_REENTRY_ENABLED=1
PROFIT_TARGET_REENTRY_DELAY=3

MAX_DAILY_LOSS_RUPEES=30000
MAX_REATTEMPTS=12
REENTRY_DELAY_BY_ATTEMPT=7,7,7,7,7,7,7,7

# Shared late profit-protect setting. 0 disables unless overridden below.
PROFIT_PROTECT_LATE_GIVEBACK=0
PROFIT_PROTECT_LATE_FROM_IST=14:30

# ---- NIFTY profile ----------------------------------------------------------
NIFTY_PROFIT_PROTECT_TRIGGER_RUPEES=0.33
NIFTY_PROFIT_PROTECT_LATE_GIVEBACK=0.30
NIFTY_PROFIT_PROTECT_LATE_FROM_IST=14:50
NIFTY_PROFIT_TARGET_LATE_FROM_IST=14:50
NIFTY_MAX_DAILY_LOSS_RUPEES=19000

# ---- SENSEX profile ---------------------------------------------------------
SENSEX_PROFIT_TARGET_PCT=0.72
SENSEX_PROFIT_TARGET_LATE_FROM_IST=14:00

# ---- Live feed / paper fills ------------------------------------------------
MONITOR_POLL_SECONDS=0.20
MONITOR_HEARTBEAT_SECONDS=5
PAPER_SLIPPAGE_TICKS=1
OPTION_TICK=0.05

# Momentum checks are performed once per minute. Historical candle API calls
# are cached within each check; this wait controls retry after missing data.
MOMENTUM_RETRY_SECONDS=5

# ---- Hardened order execution -----------------------------------------------
# Polling and hard timeout for each broker order confirmation.
ORDER_STATUS_POLL_SECONDS=0.50
ORDER_STATUS_MAX_POLLS=20
ORDER_CONFIRM_TIMEOUT_SECONDS=12

# Maximum complete entry execution cycles. Each failed cycle is reconciled,
# pending orders are cancelled, residual legs are flattened, and broker positions
# must be verified flat before the next cycle can submit any order. Maximum: 4.
ENTRY_EXECUTION_MAX_ATTEMPTS=4
ENTRY_EXECUTION_RETRY_DELAY_SECONDS=2

# If place_order() returns an error/timeout, search the broker order book for the
# possibly accepted order during this window before permitting any resubmission.
AMBIGUOUS_ORDER_RECONCILE_SECONDS=8

# Bounded emergency cleanup passes and delay between two flat-position checks.
CLEANUP_MAX_ATTEMPTS=4
CLEANUP_VERIFY_DELAY_SECONDS=0.75

# Product used for option orders: NRML is safer for expiry-day carry restrictions.
ORDER_PRODUCT=NRML

# ---- Zerodha/API resilience: ALL RETRIES ARE FINITE --------------------------
# Maximum TOTAL attempts for read-only/API calls. 0 is rejected at startup.
API_MAX_RETRIES=5
# Maximum attempts for cancel/modify actions. place_order is always submitted once
# and then reconciled from broker data to prevent duplicate orders.
API_ORDER_MAX_RETRIES=3
API_RETRY_BACKOFF_SECONDS=2
API_RETRY_BACKOFF_MAX=15
API_HTTP_TIMEOUT_SECONDS=10

# A crashed strategy loop may restart only this many times in the same process.
PROCESS_RESTART_MAX_ATTEMPTS=3
PROCESS_RESTART_DELAY_SECONDS=5

# Minimum gap between Kite REST request starts; WebSocket monitoring is unaffected.
REST_MIN_INTERVAL_SECONDS=0.35

# ---- Transaction-cost estimate ---------------------------------------------
# The daily loss breaker uses estimated NET P&L, matching the backtest design.
INCLUDE_TRANSACTION_COSTS=1
BROKERAGE_PER_ORDER=20
ORDERS_PER_TRADE=4
STT_SELL_PCT=0.001
EXCHANGE_TXN_PCT=0.0003553
SEBI_PER_CRORE=10
STAMP_BUY_PCT=0.00003
IPFT_PER_CRORE=0.010
GST_PCT=0.18

# ---- Files and logging ------------------------------------------------------
# Leave blank/commented to use defaults in the user's home directory.
# LOG_FILE=C:\Users\himan\short_straddle_v3opt_live.log
# STATE_FILE=C:\Users\himan\short_straddle_v3opt_state.json
