# =============================================================================
# live_trader_config.properties
# Strategy: atm_straddle_backtest_v2.py + straddle_config_DTE_1_v2.properties
# =============================================================================
# Format: KEY=VALUE. Environment variables already set in the OS override this
# file. Keep this file beside live_short_straddle_trader.py, or set
# STRADDLE_LIVE_CONFIG to an alternate path.
# =============================================================================

# ---- HARD SAFETY -----------------------------------------------------------
# 1 = paper fills only; no exchange orders. 0 = real exchange orders.
PAPER_TRADING=1

# Live mode is blocked unless BOTH conditions are true:
#   PAPER_TRADING=0
#   LIVE_TRADING_CONFIRM=YES_I_ACCEPT_LIVE_ORDERS
# Keep blank during paper testing.
LIVE_TRADING_CONFIRM=

# Used to reject an incompatible restart-state file.
STRATEGY_ID=atm-straddle-v2-dte1-live-20260729

# Prefix for dynamic order tags. Keep at 1-4 alphanumeric characters so the
# full timestamped tag remains within Kite's 20-character limit.
EXECUTION_TAG_PREFIX=SSV2

# AUTO_DTE exactly mirrors the backtest's daily instrument choice: among NIFTY
# and SENSEX, trade the one whose nearest adjusted expiry has an allowed DTE;
# prefer the nearer expiry and NIFTY on a tie. MANUAL uses `.env` choice.
UNDERLYING_SELECTION_MODE=AUTO_DTE

# ---- Timing (IST) ----------------------------------------------------------
ENTRY_TIME_IST=09:20
EXIT_TIME_IST=15:26

# A process launched slightly after 09:20 may enter only inside this grace
# window. Beyond it, the day is skipped because the backtest has no late entry.
ENTRY_GRACE_SECONDS=3600

# ---- DTE gate --------------------------------------------------------------
# This configuration is DTE-1 only.
ALLOWED_DTE=1

# 1 = fail closed when calculated DTE is not allowed. 0 = log and override.
ENFORCE_DTE=1

# ---- Stop-loss -------------------------------------------------------------
# Per-attempt loss percentage of collected premium. Attempts beyond the list
# reuse the last value.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444,0.2555,0.2666,0.2776,0.2887,0.2998,0.3108

# Effective stop = min(percentage stop, this rupee cap). 0 disables the cap.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=3500

# ---- Split profit-protect --------------------------------------------------
# Legacy fallback retained for compatibility with the v2 backtest.
PROFIT_PROTECT_TRIGGER_RUPEES=0.0816

# Arm the trailing rule after this fraction of collected premium is earned.
PROFIT_PROTECT_ARM_PCT=0.2350

# Exit after surrendering this fraction of collected premium from peak P&L.
PROFIT_PROTECT_GIVEBACK_PCT=0.2000

# ---- Breakeven ratchet -----------------------------------------------------
# Both are disabled in the supplied DTE-1 v2 configuration.
BREAKEVEN_ARM_PCT=0.0000
BREAKEVEN_LOCK_PCT=0.0000

# ---- Profit target ---------------------------------------------------------
# Gross attempt P&L target; hitting it ends the day.
PROFIT_TARGET_PCT=0.1700

# ---- Daily loss breaker ----------------------------------------------------
# Uses realised P&L after the estimated charge model below.
MAX_DAILY_LOSS_RUPEES=20000

# ---- Re-entry --------------------------------------------------------------
# Maximum re-entries after STOPLOSS / PROFIT_PROTECT. Six means up to seven
# total attempts, matching the backtest's semantics.
MAX_REATTEMPTS=6
REENTRY_DELAY_BY_ATTEMPT=7,10,13,16,19,22

# Skip a re-entry if the fresh ATM premium exceeds this multiple of the
# immediately preceding accepted entry premium. 0 disables.
REENTRY_MAX_PREMIUM_RATIO=1.3200

# ---- Estimated transaction costs ------------------------------------------
# Mirrors atm_straddle_backtest_v2.py. These estimates affect daily realised
# P&L and the daily breaker, not the gross stop/target/protect thresholds.
INCLUDE_ESTIMATED_TRANSACTION_COSTS=1
BROKERAGE_PER_ORDER=20
ORDERS_PER_TRADE=4
STT_SELL_PCT=0.001
EXCHANGE_TXN_PCT=0.0003553
SEBI_PER_CRORE=10
STAMP_BUY_PCT=0.00003
IPFT_PER_CRORE=0.010
GST_PCT=0.18

# ---- WebSocket / paper fills ----------------------------------------------
MONITOR_POLL_SECONDS=0.2
MONITOR_HEARTBEAT_SECONDS=5
PAPER_SLIPPAGE_TICKS=1
# Paper-fill fallback only. Live orders read tick_size and lot_size from the
# current Kite instrument dump before order placement.
OPTION_TICK=0.05

# ---- Bounded API and order execution ---------------------------------------
# All values are finite. API_MAX_RETRIES is the total attempt count for broker
# read calls. place_order itself is never blindly retried after an ambiguous
# response; deterministic tags and broker reconciliation are used instead.
API_MAX_RETRIES=4
API_ORDER_MAX_RETRIES=2
API_RETRY_BACKOFF_SECONDS=1
API_RETRY_BACKOFF_MAX=5

# Maximum broker execution cycles for one logical straddle entry/exit.
# Keep ENTRY_EXECUTION_MAX_ATTEMPTS at 4 as required by the live safety design.
ENTRY_EXECUTION_MAX_ATTEMPTS=4
EXIT_EXECUTION_MAX_ATTEMPTS=4

# Per-cycle time budget for broker confirmation of both legs.
ORDER_CONFIRM_TIMEOUT_SECONDS=8
ORDER_CONFIRM_POLL_SECONDS=0.5

# After a lost/ambiguous place_order response, inspect broker order/position
# data for this long. No replacement order is submitted while the tag is
# ambiguous.
ORDER_DISCOVERY_TIMEOUT_SECONDS=5

# Failed entry/exit cleanup: cancel pending orders, restore target quantities,
# and require two consecutive matching position snapshots.
CLEANUP_MAX_ATTEMPTS=4
CLEANUP_CONFIRM_TIMEOUT_SECONDS=8

# Finite process-level restart/reconciliation budget.
PROCESS_MAX_RESTARTS=3
PROCESS_RESTART_DELAY_SECONDS=5

# ---- Logs and restart state ------------------------------------------------
# Leave commented to use defaults under the current user's home directory.
# LOG_FILE=C:\Users\Local User\short_straddle_v2_live.log
# STATE_FILE=C:\Users\Local User\short_straddle_v2_state.json
