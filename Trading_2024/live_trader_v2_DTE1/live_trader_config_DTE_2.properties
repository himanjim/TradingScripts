# =============================================================================
# live_trader_config.properties
# Strategy source: atm_straddle_DTE2_v2_profit_20260727_203741_BEST.properties
# Executor: live_short_straddle_trader.py (hardened v2 live/paper trader)
# =============================================================================
# Format: KEY=VALUE. Environment variables already set in the operating system
# override this file. Keep this file beside live_short_straddle_trader.py, or
# point STRADDLE_LIVE_CONFIG to this file.
#
# Backtest-only keys such as PICKLES_DIR, LOOKBACK_MONTHS and
# FAIL_ON_PICKLE_ERROR are intentionally omitted because the live trader does
# not use historical pickle files.
# =============================================================================

# ---- HARD SAFETY -----------------------------------------------------------
# 1 = paper fills only; no exchange orders. 0 = real exchange orders.
PAPER_TRADING=1

# Live mode is blocked unless BOTH conditions are true:
#   PAPER_TRADING=0
#   LIVE_TRADING_CONFIRM=YES_I_ACCEPT_LIVE_ORDERS
# Keep blank during paper testing.
LIVE_TRADING_CONFIRM=

# Used to reject a restart-state file belonging to another strategy/config.
STRATEGY_ID=atm-straddle-v2-dte2-live-20260729

# Prefix used in timestamped Kite order tags. Keep this 1-4 alphanumeric
# characters so the complete tag remains within Kite's tag-length limit.
EXECUTION_TAG_PREFIX=SSV2

# AUTO_DTE mirrors the backtest's daily instrument choice. It considers NIFTY
# and SENSEX, keeps contracts whose calculated DTE is allowed, chooses the
# nearer expiry and prefers NIFTY if both expiries tie.
# MANUAL instead uses `choice` from .env.
UNDERLYING_SELECTION_MODE=AUTO_DTE

# ---- Timing (IST) ----------------------------------------------------------
# Strategy values copied unchanged from the attached DTE-2 optimiser output.
ENTRY_TIME_IST=09:40
EXIT_TIME_IST=15:07

# Maximum delay after 09:40 within which the first entry may still be placed.
# A later start is skipped because the backtest has no equivalent late entry.
ENTRY_GRACE_SECONDS=60

# ---- DTE gate --------------------------------------------------------------
# DTE-2 only, copied unchanged from the optimiser output.
ALLOWED_DTE=2

# 1 = fail closed when the calculated contract DTE is not allowed.
# 0 = log the mismatch and continue by explicit override.
ENFORCE_DTE=1

# ---- Stop-loss -------------------------------------------------------------
# Per-attempt loss percentage of collected premium. Attempts beyond this list
# reuse the final value.
LOSS_LIMIT_RUPEES_BY_ATTEMPT=0.2444,0.2555,0.2666,0.2776,0.2887,0.2998,0.3108

# Effective stop = min(percentage-based stop, this rupee cap).
# 0 disables the absolute cap.
MAX_LOSS_LIMIT_RUPEES_BY_ATTEMPT=5000

# ---- Split profit-protect --------------------------------------------------
# Legacy fallback retained because the live trader and backtester support it.
PROFIT_PROTECT_TRIGGER_RUPEES=0.120000

# Arm the trailing rule after this fraction of collected premium is earned.
PROFIT_PROTECT_ARM_PCT=0.120000

# Exit after surrendering this fraction of collected premium from peak P&L.
PROFIT_PROTECT_GIVEBACK_PCT=0.010000

# ---- Breakeven ratchet -----------------------------------------------------
# Once peak P&L reaches the arm fraction, lift the stop floor to the configured
# lock fraction of collected premium.
BREAKEVEN_ARM_PCT=0.120000
BREAKEVEN_LOCK_PCT=0.010000

# ---- Profit target ---------------------------------------------------------
# Gross attempt P&L target as a fraction of collected premium. Reaching it
# exits the position and ends trading for the day.
PROFIT_TARGET_PCT=0.110000

# ---- Daily loss breaker ----------------------------------------------------
# Uses realised P&L after the estimated transaction-cost model below.
MAX_DAILY_LOSS_RUPEES=20000

# ---- Re-entry --------------------------------------------------------------
# Ten means up to eleven total attempts: the first entry plus ten re-entries.
MAX_REATTEMPTS=10

# Delay in minutes after attempt indexes 0..9. Attempts beyond the list reuse
# the final value, although MAX_REATTEMPTS currently prevents that situation.
REENTRY_DELAY_BY_ATTEMPT=20,23,26,29,32,35,38,41,44,47

# 0 disables the fresh-premium re-entry gate.
REENTRY_MAX_PREMIUM_RATIO=0.000000

# ---- Estimated transaction costs ------------------------------------------
# These estimates affect daily realised P&L and the daily loss breaker. They do
# not alter the gross stop, target, profit-protect or breakeven thresholds.
INCLUDE_ESTIMATED_TRANSACTION_COSTS=1
BROKERAGE_PER_ORDER=20
ORDERS_PER_TRADE=4
STT_SELL_PCT=0.001
EXCHANGE_TXN_PCT=0.0003553
SEBI_PER_CRORE=10
STAMP_BUY_PCT=0.00003
IPFT_PER_CRORE=0.010
GST_PCT=0.18

# ---- WebSocket and paper fills --------------------------------------------
MONITOR_POLL_SECONDS=0.2
MONITOR_HEARTBEAT_SECONDS=5
PAPER_SLIPPAGE_TICKS=1

# Paper-fill fallback. Live orders obtain tick_size and lot_size from Kite's
# current instrument dump before placement.
OPTION_TICK=0.05

# ---- Bounded API and order execution --------------------------------------
# All retry counts are finite. API_MAX_RETRIES is the maximum attempt count for
# ordinary broker reads. place_order is not blindly repeated after an ambiguous
# response; timestamped tags, orders and positions are reconciled first.
API_MAX_RETRIES=4
API_ORDER_MAX_RETRIES=2
API_RETRY_BACKOFF_SECONDS=1
API_RETRY_BACKOFF_MAX=5

# Maximum broker execution cycles for one logical straddle entry or exit.
# ENTRY_EXECUTION_MAX_ATTEMPTS must remain at or below 4 in the hardened trader.
ENTRY_EXECUTION_MAX_ATTEMPTS=4
EXIT_EXECUTION_MAX_ATTEMPTS=4

# Per-cycle broker confirmation budget for both legs.
ORDER_CONFIRM_TIMEOUT_SECONDS=8
ORDER_CONFIRM_POLL_SECONDS=0.5

# After a lost or ambiguous place_order response, reconcile tagged orders and
# positions for this duration before deciding whether any quantity is missing.
ORDER_DISCOVERY_TIMEOUT_SECONDS=5

# Failed execution cleanup: cancel pending orders, restore the intended target
# position and require consecutive matching broker snapshots.
CLEANUP_MAX_ATTEMPTS=4
CLEANUP_CONFIRM_TIMEOUT_SECONDS=8

# Finite process-level restart and reconciliation budget.
PROCESS_MAX_RESTARTS=3
PROCESS_RESTART_DELAY_SECONDS=5

# ---- Logs and restart state ------------------------------------------------
# Uncomment and customise when required.
# LOG_FILE=C:\Users\Local User\short_straddle_v2_dte2_live.log
# STATE_FILE=C:\Users\Local User\short_straddle_v2_dte2_state.json
